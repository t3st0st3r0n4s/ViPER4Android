name: Publish widget preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-widget-preview.yml
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful release-test APK workflow run ID
        required: true
        type: string
      source_sha:
        description: Commit SHA built by that workflow
        required: true
        type: string
      tag:
        description: New preview release tag
        required: true
        type: string

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'release: publish widget preview v2.1.1'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || '39299957514' }}
      SOURCE_SHA: ${{ inputs.source_sha || 'f42838cc34aaee9fee335d783e694e5f29caddd4' }}
      RELEASE_TAG: ${{ inputs.tag || 'v2.1.1-widget-preview.1' }}
      ARTIFACT_NAME: ViPER4Android-2.1.1-preset-widget-release-test
    steps:
      - name: Verify previously built release-test artifact
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq '.conclusion')" = success
      - name: Download existing APK without rebuilding
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist
          apk="$(find dist -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mv "$apk" "dist/ViPER4Android-$RELEASE_TAG.apk"
          (cd dist && sha256sum "ViPER4Android-$RELEASE_TAG.apk" > SHA256SUMS.txt)
      - name: Publish prerelease
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## ViPER4Android 2.1.1 — Preset Widget Preview 1

          Fork of [likelikeslike/ViPER4Android](https://github.com/likelikeslike/ViPER4Android) with a configurable home-screen preset launcher.

          ### Widget features
          - Apply saved ViPER presets from the launcher without opening the app
          - Select and drag presets into the preferred order with haptic feedback
          - Horizontal, vertical, or automatic layout; spacing, insets, corners, and borders
          - Independent active/inactive colours and transparency, preset text size and weight, and optional widget labels
          - Sticky live preview, with adaptive height and hide/show control for landscape
          - Device-aware preset highlighting, refreshed after app-side preset changes

          ### Installation and signing
          This APK is a **preview build**, minified and signed with a temporary CI debug key. It is **not signed with a permanent release certificate** and may not install over an existing ViPER4Android APK. Back up settings before replacing your existing app. You still need a compatible ViPER4Android DSP driver/module.

          **Source commit:** f42838cc34aaee9fee335d783e694e5f29caddd4
          **Verified CI build:** https://github.com/t3st0st3r0n4s/ViPER4Android/actions/runs/39299957514
          **Device qualification:** Full end-to-end BOARD acceptance not established by CI.
          EOF
          gh release create "$RELEASE_TAG" "dist/ViPER4Android-$RELEASE_TAG.apk" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "ViPER4Android 2.1.1 — Preset Widget Preview 1" \
            --notes-file release-notes.md \
            --prerelease

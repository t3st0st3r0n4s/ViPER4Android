name: Publish widget preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-widget-preview.yml
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful release-test APK workflow run ID
        required: true
        type: string
      source_sha:
        description: Commit SHA built by that workflow
        required: true
        type: string
      tag:
        description: New preview release tag
        required: true
        type: string

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'release: publish widget preview')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || '44568324215' }}
      SOURCE_SHA: ${{ inputs.source_sha || 'c9e5d176e571a5da99864cec8bd17e9297ba35a6' }}
      RELEASE_TAG: ${{ inputs.tag || 'v2.1.2-widget-preview.2' }}
      ARTIFACT_NAME: ViPER4Android-2.1.2-preset-widget-release-test
    steps:
      - name: Verify previously built release-test artifact
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq '.conclusion')" = success
      - name: Download existing APK without rebuilding
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist
          apk="$(find dist -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mv "$apk" "dist/ViPER4Android-$RELEASE_TAG.apk"
          (cd dist && sha256sum "ViPER4Android-$RELEASE_TAG.apk" > SHA256SUMS.txt)
      - name: Publish prerelease
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## Changelog — Preview 2

          - Active preset highlight now matches actual effect settings, not the last selected preset.
          - Highlight automatically returns when settings match a saved preset again.
          - Corrected highlighting across audio-device changes.
          - Flushes pending widget refresh when closing settings.

          **APK source:** c9e5d176e571a5da99864cec8bd17e9297ba35a6
          **Verified build:** https://github.com/t3st0st3r0n4s/ViPER4Android/actions/runs/44568324215
          EOF
          gh release create "$RELEASE_TAG" "dist/ViPER4Android-$RELEASE_TAG.apk" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ViPER4Android 2.1.2 — Preset Widget Preview 2" \
            --notes-file release-notes.md \
            --prerelease

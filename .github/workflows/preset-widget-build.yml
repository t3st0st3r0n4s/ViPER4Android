name: Preset widget build

on:
  push:
    branches: [feature/preset-widget]

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Install available Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Use SDK 36 for CI only (upstream SDK 37 unavailable)
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          grep -F 'compileSdk = 36' app/build.gradle.kts
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ViPER4Android-2.1.1-preset-widget-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Preset widget build

on:
  push:
    branches: [feature/preset-widget]

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK 37.2
        run: sdkmanager --channel=3 --install 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Select API 37.2 minor SDK for CI
        run: |
          sed -i '/compileSdk = 37/a\    compileSdkMinor = 2' app/build.gradle.kts
          grep -F 'compileSdkMinor = 2' app/build.gradle.kts
      - name: Sign minified release test APK with ephemeral debug key
        run: |
          sed -i 's/signingConfigs.getByName("release") else null/signingConfigs.getByName("release") else signingConfigs.getByName("debug")/' app/build.gradle.kts
          grep -F 'else signingConfigs.getByName("debug")' app/build.gradle.kts
      - name: Build minified release-variant test APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Report exact APK byte size
        run: stat -c 'APK %n %s bytes' app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ViPER4Android-2.1.1-preset-widget-release-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
